<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="description" content="Snake Game - classic snake with swipe, D-pad and keyboard controls.">
<meta name="theme-color" content="#f7f3f0">
<title>Snake Game - Amrit</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐍</text></svg>">
<style>
:root{--bg:#f7f3f0;--card:#fff;--text:#4a3b32;--muted:#8c786d;--primary:#964B00;--border:#d8ceca;--ok:#2e7d32;--adbar:#ece7e2}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;-webkit-tap-highlight-color:transparent}
html,body{width:100%;min-height:100%;background:var(--bg);color:var(--text)}
.page{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center}
main{flex:1;width:100%;display:flex;justify-content:center;align-items:center;padding:8px}
.game{width:100%;max-width:560px;background:var(--card);padding:12px;border-radius:14px;
  box-shadow:0 6px 20px rgba(139,69,19,.08);border:1px solid var(--border)}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.brand{font-size:1.4rem;font-weight:700;color:var(--primary)}
.btns{display:flex;gap:8px}
.icon-btn{background:#f0eae5;border:0;width:40px;height:40px;border-radius:50%;cursor:pointer;font-size:1.1rem}
.stats{display:flex;justify-content:space-between;margin-bottom:8px;font-size:.95rem;font-weight:600;color:var(--muted);
  background:#fdfbf7;padding:8px 14px;border-radius:6px;border:1px solid var(--border)}
.stats b{color:var(--primary)}
.wrap{position:relative;margin:0 auto 10px;border-radius:10px;overflow:hidden;border:2px solid #bfa79e;touch-action:none;width:fit-content}
canvas{display:block}
.overlay{position:absolute;inset:0;background:rgba(74,59,50,.55);backdrop-filter:blur(3px);display:flex;flex-direction:column;
  justify-content:center;align-items:center;text-align:center;color:#fff;padding:16px;gap:8px}
.overlay.hide{display:none}
.overlay h2{font-size:1.6rem}
.overlay p{font-size:.9rem;line-height:1.5;opacity:.95}
.action{padding:12px 28px;font-size:1.05rem;font-weight:600;border:0;border-radius:8px;cursor:pointer;background:var(--primary);color:#fff;box-shadow:0 2px 6px rgba(150,75,0,.3)}
.dpad{display:none;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(2,52px);gap:6px;justify-content:center}
.dpad button{background:#f0eae5;border:2px solid var(--border);border-radius:10px;font-size:1.3rem;color:var(--primary);cursor:pointer}
.dpad button:active{background:var(--primary);color:#fff}
.dpad .up{grid-column:2;grid-row:1}.dpad .left{grid-column:1;grid-row:2}.dpad .down{grid-column:2;grid-row:2}.dpad .right{grid-column:3;grid-row:2}
@media (pointer:coarse){.dpad{display:grid}}
.hint{display:none;text-align:center;font-size:.8rem;color:var(--muted)}
@media (pointer:fine){.hint{display:block}}

.modal{display:none;position:fixed;inset:0;background:rgba(74,59,50,.45);backdrop-filter:blur(4px);justify-content:center;align-items:center;z-index:20;padding:16px}
.box{background:#fff;padding:18px;border-radius:12px;width:100%;max-width:300px;text-align:center;box-shadow:0 10px 25px rgba(0,0,0,.15)}
.box h3{margin-bottom:10px;font-size:1.1rem}
.setting{margin-bottom:12px;text-align:left}
.setting label{font-size:.75rem;font-weight:600;color:var(--muted);display:block;margin-bottom:4px}
.opts{display:flex;gap:6px}
.opt{flex:1;padding:8px 4px;border:2px solid var(--border);background:#fff;border-radius:6px;font-weight:600;cursor:pointer;color:var(--text);font-size:.78rem}
.opt.active{border-color:var(--primary);background:#fdfbf7;color:var(--primary)}
.link{background:none;border:0;color:var(--muted);font-size:.8rem;margin-top:10px;cursor:pointer;text-decoration:underline}
.box .action{width:100%}

footer{width:100%;text-align:center;margin-top:auto}
.copy{font-size:.85rem;color:var(--muted);padding:12px 10px}
.copy strong{color:var(--primary);font-style:italic;font-weight:600}
.adbar{width:100%;background:var(--adbar);padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}
.adslot{position:relative;min-width:320px;min-height:50px;max-width:100%;background:#fff;display:flex;justify-content:center;align-items:center;overflow:hidden}
.ad-fallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#e8f0fe;color:#1a56c4;font-size:.75rem;font-weight:600;border:1px dashed #9bb7ea}
</style>
</head>
<body>
<div class="page">
<main>
  <div class="game" id="game">
    <div class="top">
      <span class="brand">🐍 Snake Game</span>
      <div class="btns">
        <button class="icon-btn" id="muteBtn" title="Sound" aria-label="Sound">🔊</button>
        <button class="icon-btn" id="pauseBtn" title="Pause" aria-label="Pause">⏸️</button>
        <button class="icon-btn" id="setBtn" title="Settings" aria-label="Settings">⚙️</button>
      </div>
    </div>
    <div class="stats">
      <span>Score: <b id="score">0</b></span>
      <span>Level: <b id="level">1</b></span>
      <span>Best: <b id="best">0</b></span>
    </div>
    <div class="wrap" id="wrap">
      <canvas id="cv"></canvas>
      <div class="overlay" id="overlay">
        <h2 id="ovTitle">Snake</h2>
        <p id="ovText">Swipe on the board or use the buttons to steer.</p>
        <button class="action" id="ovBtn">Play</button>
      </div>
    </div>
    <div class="dpad" id="dpad">
      <button class="up" data-d="up" aria-label="Up">▲</button>
      <button class="left" data-d="left" aria-label="Left">◀</button>
      <button class="down" data-d="down" aria-label="Down">▼</button>
      <button class="right" data-d="right" aria-label="Right">▶</button>
    </div>
    <div class="hint">Arrow keys / WASD to move · Space to pause</div>
  </div>
</main>

<footer id="footer">
  <div class="copy">Copyright &copy; <strong>Amrit Bharadwaj</strong> All Rights Reserved</div>
  <div class="adbar"><div class="adslot" id="adslot"><div class="ad-fallback" id="adFallback">Ad loading… (320×50)</div></div></div>
</footer>
</div>

<div class="modal" id="modal">
  <div class="box">
    <h3>Game Settings</h3>
    <div class="setting"><label>Mode</label>
      <div class="opts"><button class="opt" data-k="mode" data-v="walls">Walls</button><button class="opt" data-k="mode" data-v="wrap">Wrap-around</button></div></div>
    <div class="setting"><label>Speed</label>
      <div class="opts"><button class="opt" data-k="speed" data-v="easy">Easy</button><button class="opt" data-k="speed" data-v="normal">Normal</button><button class="opt" data-k="speed" data-v="fast">Fast</button></div></div>
    <button class="action" id="applyBtn">Apply &amp; Play</button>
    <button class="link" id="cancelBtn">Cancel</button>
  </div>
</div>

<script>
/* ===== TEST AD (Google Publisher Tag sample unit) ===== */
const AD_UNIT="/6355419/Travel/Europe/France/Paris";
(function(){
  const d=document.createElement("div");d.id="test-ad";document.getElementById("adslot").appendChild(d);
  const g=document.createElement("script");g.async=true;g.crossOrigin="anonymous";
  g.src="https://securepubads.g.doubleclick.net/tag/js/gpt.js";document.head.appendChild(g);
  window.googletag=window.googletag||{cmd:[]};
  let big=false;const fb=()=>document.getElementById("adFallback");
  function req(size){googletag.cmd.push(()=>{
    const o=googletag.pubads().getSlots();if(o.length)googletag.destroySlots(o);
    googletag.defineSlot(AD_UNIT,size,"test-ad").addService(googletag.pubads());
    googletag.enableServices();googletag.display("test-ad");});}
  googletag.cmd.push(()=>{googletag.pubads().addEventListener("slotRenderEnded",e=>{
    if(e.isEmpty){if(!big){big=true;req([300,250]);}else fb().textContent="Ad space (320×50)";}
    else{fb().style.display="none";setTimeout(fit,50);}});});
  req([320,50]);
  setTimeout(()=>{if(fb().style.display!=="none")fb().textContent="Ad space (320×50)";},5000);
})();

/* ===== SOUND (Web Audio, no files needed) ===== */
let ac=null,muted=false;
try{muted=localStorage.getItem("snake_muted")==="1";}catch(e){}
function audio(){
  if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}
  if(ac&&ac.state==="suspended")ac.resume();
  return ac;
}
function tone(f,t0,dur,type,vol,to){
  const a=audio();if(!a||muted)return;
  const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+t0;
  o.type=type;o.frequency.setValueAtTime(f,t);
  if(to)o.frequency.exponentialRampToValueAtTime(to,t+dur);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.02);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.05);
}
const sfx={
  start(){[523,659,784,1047].forEach((f,i)=>tone(f,i*.09,.16,"triangle",.18));},          // rising chime
  eat(){tone(700,0,.09,"square",.09);tone(1050,.07,.12,"square",.09);},                    // quick blip-blip
  over(){[392,330,262].forEach((f,i)=>tone(f,i*.2,.28,"sawtooth",.1));tone(196,.62,.6,"sawtooth",.1,98);} // sad descending
};
function paintMute(){$("muteBtn").textContent=muted?"🔇":"🔊";}

/* ===== SNAKE ===== */
const N=20, $=id=>document.getElementById(id);
const cv=$("cv"), ctx=cv.getContext("2d");
const BASE={easy:170,normal:130,fast:95};
let cfg={mode:"walls",speed:"normal"}, pend={...cfg};
try{const s=JSON.parse(localStorage.getItem("snake_cfg"));if(s)cfg={...cfg,...s};}catch(e){}
let snake,dir,queue,food,score,eaten,delay,state="idle",timer=null,size=300,cell=15,best=0;

function loadBest(){try{best=+localStorage.getItem("snake_best_"+cfg.mode)||0;}catch(e){best=0;}$("best").textContent=best;}
function saveBest(){try{localStorage.setItem("snake_best_"+cfg.mode,best);}catch(e){}}

function fit(){
  const g=$("game"),w=$("wrap");
  const used=$("footer").offsetHeight+(g.offsetHeight-w.offsetHeight)+28;
  size=Math.floor(Math.min(g.clientWidth-26,innerHeight-used));
  size=Math.max(240,size-size%N);
  const dpr=window.devicePixelRatio||1;
  cv.style.width=cv.style.height=size+"px";
  cv.width=cv.height=size*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  cell=size/N;draw();
}

function reset(){
  snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];dir={x:1,y:0};queue=[];
  score=0;eaten=0;delay=BASE[cfg.speed];placeFood();ui();
}
function ui(){$("score").textContent=score;$("level").textContent=1+Math.floor(eaten/5);}
function placeFood(){
  const free=[];for(let x=0;x<N;x++)for(let y=0;y<N;y++)if(!snake.some(s=>s.x===x&&s.y===y))free.push({x,y});
  food=free.length?free[Math.floor(Math.random()*free.length)]:null;
}

function overlay(t,p,b){$("ovTitle").textContent=t;$("ovText").innerHTML=p;$("ovBtn").textContent=b;$("overlay").classList.remove("hide");}
function start(){sfx.start();reset();state="running";$("overlay").classList.add("hide");$("pauseBtn").textContent="⏸️";loop();}
function pause(){if(state!=="running")return;state="paused";clearTimeout(timer);$("pauseBtn").textContent="▶️";overlay("Paused","Take a breath.","Resume");}
function resume(){if(state!=="paused")return;state="running";$("overlay").classList.add("hide");$("pauseBtn").textContent="⏸️";loop();}
function over(){
  state="over";clearTimeout(timer);sfx.over();
  let msg="Score: <b>"+score+"</b><br>Best: <b>"+Math.max(best,score)+"</b>";
  if(score>best&&score>0){best=score;saveBest();$("best").textContent=best;msg+="<br>🏆 New best score!";}
  try{navigator.vibrate&&navigator.vibrate(120);}catch(e){}
  overlay("Game Over",msg,"Play Again");
}
function loop(){timer=setTimeout(()=>{tick();if(state==="running")loop();},delay);}

function tick(){
  while(queue.length){const d=queue.shift();if(!(d.x===-dir.x&&d.y===-dir.y)&&!(d.x===dir.x&&d.y===dir.y)){dir=d;break;}}
  let h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
  if(cfg.mode==="wrap"){h.x=(h.x+N)%N;h.y=(h.y+N)%N;}
  else if(h.x<0||h.y<0||h.x>=N||h.y>=N){draw();return over();}
  const ate=food&&h.x===food.x&&h.y===food.y;
  const body=ate?snake:snake.slice(0,-1);
  if(body.some(s=>s.x===h.x&&s.y===h.y)){draw();return over();}
  snake.unshift(h);
  if(ate){
    sfx.eat();score+=10;eaten++;delay=Math.max(60,BASE[cfg.speed]-Math.floor(eaten/5)*8);placeFood();ui();
    if(!food){draw();return over();}
  } else snake.pop();
  draw();
}

function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,r):ctx.rect(x,y,w,h);ctx.fill();}
function draw(){
  if(!snake)return;
  for(let x=0;x<N;x++)for(let y=0;y<N;y++){ctx.fillStyle=(x+y)%2?"#efe6de":"#f6efe8";ctx.fillRect(x*cell,y*cell,cell,cell);}
  if(food){
    const cx=(food.x+.5)*cell,cy=(food.y+.55)*cell,r=cell*.36;
    ctx.fillStyle="#c62828";ctx.beginPath();ctx.arc(cx,cy,r,0,7);ctx.fill();
    ctx.fillStyle="#2e7d32";ctx.beginPath();ctx.ellipse(cx+r*.45,cy-r*1.05,r*.5,r*.25,-.5,0,7);ctx.fill();
  }
  const L=snake.length;
  for(let i=L-1;i>=0;i--){
    const s=snake[i],t=1-i/Math.max(L,8);
    ctx.fillStyle="hsl(125,"+(45+t*10)+"%,"+(48-t*20)+"%)";
    const p=cell*.06;rr(s.x*cell+p,s.y*cell+p,cell-2*p,cell-2*p,cell*.3);
  }
  const h=snake[0],ex=dir.y!==0?[.3,.7]:[.65,.65],ey=dir.y!==0?[.6*(dir.y>0?1.1:.7),.6*(dir.y>0?1.1:.7)]:[.3,.7];
  ctx.fillStyle="#fff";
  for(let k=0;k<2;k++){const px=dir.y!==0?ex[k]:(dir.x>0?.68:.32),py=dir.y!==0?(dir.y>0?.68:.32):ey[k];
    ctx.beginPath();ctx.arc((h.x+px)*cell,(h.y+py)*cell,cell*.11,0,7);ctx.fill();}
  ctx.fillStyle="#222";
  for(let k=0;k<2;k++){const px=dir.y!==0?ex[k]:(dir.x>0?.7:.3),py=dir.y!==0?(dir.y>0?.7:.3):ey[k];
    ctx.beginPath();ctx.arc((h.x+px)*cell,(h.y+py)*cell,cell*.05,0,7);ctx.fill();}
}

/* ===== controls ===== */
const DIRS={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}};
function steer(n){
  if(state==="idle"||state==="over")return;
  if(state==="paused")return;
  if(queue.length<3)queue.push(DIRS[n]);
}
document.querySelectorAll(".dpad button").forEach(b=>b.addEventListener("pointerdown",e=>{e.preventDefault();steer(b.dataset.d);}));
addEventListener("keydown",e=>{
  const m={ArrowUp:"up",w:"up",W:"up",ArrowDown:"down",s:"down",S:"down",ArrowLeft:"left",a:"left",A:"left",ArrowRight:"right",d:"right",D:"right"}[e.key];
  if(m){e.preventDefault();steer(m);}
  else if(e.key===" "){e.preventDefault();state==="running"?pause():state==="paused"?resume():($("modal").style.display!=="flex"&&start());}
});
let tx=0,ty=0;
$("wrap").addEventListener("touchstart",e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
$("wrap").addEventListener("touchmove",e=>{
  if(state!=="running")return;
  const dx=e.touches[0].clientX-tx,dy=e.touches[0].clientY-ty;
  if(Math.max(Math.abs(dx),Math.abs(dy))>22){steer(Math.abs(dx)>Math.abs(dy)?(dx>0?"right":"left"):(dy>0?"down":"up"));tx=e.touches[0].clientX;ty=e.touches[0].clientY;}
},{passive:true});
$("muteBtn").onclick=()=>{muted=!muted;try{localStorage.setItem("snake_muted",muted?"1":"0");}catch(e){}paintMute();if(!muted)sfx.eat();};
$("ovBtn").onclick=()=>state==="paused"?resume():start();
$("pauseBtn").onclick=()=>state==="running"?pause():state==="paused"?resume():0;
document.addEventListener("visibilitychange",()=>{if(document.hidden)pause();});

/* ===== settings ===== */
function paint(){document.querySelectorAll(".opt").forEach(o=>o.classList.toggle("active",pend[o.dataset.k]===o.dataset.v));}
document.querySelectorAll(".opt").forEach(o=>o.onclick=()=>{pend[o.dataset.k]=o.dataset.v;paint();});
$("setBtn").onclick=()=>{pause();pend={...cfg};paint();$("modal").style.display="flex";};
$("cancelBtn").onclick=()=>{$("modal").style.display="none";};
$("applyBtn").onclick=()=>{
  cfg={...pend};try{localStorage.setItem("snake_cfg",JSON.stringify(cfg));}catch(e){}
  $("modal").style.display="none";clearTimeout(timer);state="idle";loadBest();reset();draw();
  overlay("Snake","Mode: "+(cfg.mode==="walls"?"Walls":"Wrap-around")+" · Speed: "+cfg.speed,"Play");
};

addEventListener("resize",fit);
paintMute();loadBest();reset();fit();
overlay("Snake","Swipe on the board, use the buttons or arrow keys to steer.<br>Eat apples, avoid walls and yourself.","Play");
</script>
</body>
</html>
